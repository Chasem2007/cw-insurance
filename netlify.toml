[build]
  publish = "."

# Pretty URLs — /team, /about, etc. resolve to their .html files.
# (No SPA catch-all: this is a multi-page site and unknown paths should 404.)
# Internal planning docs sit in the repo root, and publish = "." uploads the
# whole root - so they have to be blocked at the edge, not just left unlinked.
[[redirects]]
  from   = "/notion/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/team"
  to     = "/team.html"
  status = 200
[[redirects]]
  from   = "/about"
  to     = "/about.html"
  status = 200
[[redirects]]
  from   = "/coverage"
  to     = "/coverage.html"
  status = 200
[[redirects]]
  from   = "/contact"
  to     = "/contact.html"
  status = 200
[[redirects]]
  from   = "/quote"
  to     = "/contact.html"
  status = 200

# Location pages
[[redirects]]
  from   = "/billings"
  to     = "/billings.html"
